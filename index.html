<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caxtus.io</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ==== Color Variables ==== */
        :root {
            --background-color: #000000;
            --title-stroke-color: #000000;
            --input-bg-color: #ffffff;
            --input-text-color: #000000;
            --input-border-color: #000000;
            --button-bg-color: #26c214ff;
            --button-border-color: #1d901599;
            --button-hover-color: #28b717ff;
            --craft-bg-color: #dba456ff;
            --craft-border-color: #b07e3cff;
            --craft-text-color: #ffffff;
            
            /* Settings Button Colors */
            --settings-bg: #989898ff;
            --settings-border: #767676ff;

            /* Account Button Colors (Purple) */
            --account-bg: #9f5cbaff;
            --account-border: #8136a1ff;

            /* Changelog Button Colors (Green) */
            --changelog-bg: #9eb770ff; 
            --changelog-border: #849761;

            /* Minimap Colors */
            --minimap-bg: #000000;
            --minimap-border: #ffffff;
            --minimap-label-color: #ffffff;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Ubuntu', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: var(--background-color);
            user-select: none;
        }

        /* === MENU LAYER === */
        .menu-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s;
        }

        .menu-layer.hidden {
            display: none; 
        }

        .menu-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            color: white;
        }

        /* === STYLIZED TEXT CLASS === */
        .stylized-text {
            user-select: none;
            color: #ffffff;
            text-shadow: 
                -0.04em -0.04em 0 #000000,
                 0.04em -0.04em 0 #000000,
                -0.04em  0.04em 0 #000000,
                 0.04em  0.04em 0 #000000,
                -0.04em  0      0 #000000,
                 0.04em  0      0 #000000,
                 0      -0.04em 0 #000000,
                 0       0.04em 0 #000000;
        }

        h1 {
            font-size: 70px;
            font-weight: 700; 
            position: absolute;
            top: -150px;
            left: 60px;
            border-radius: 10px;
            padding: 10px;
            margin: 0;
        }

        /* === MAP SELECTOR === */
        .map-selector {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 26;
        }

        .arrow-btn {
            background: none;
            border: none;
            color: white;
            font-family: 'Ubuntu', sans-serif;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 2px 2px 0 #000;
            transition: transform 0.1s, color 0.1s;
            line-height: 1;
            padding: 0 5px;
        }

        .arrow-btn:hover {
            transform: scale(1.2);
            color: #ddd;
        }

        .arrow-btn:active {
            transform: scale(0.9);
        }

        .map-name {
            font-size: 24px;
            font-weight: bold;
            text-transform: capitalize;
            min-width: 120px;
            text-align: center;
            user-select: none;
        }

        /* === GUEST LABEL === */
        .guest-label {
            position: absolute;
            top: 10px;
            right: 15px;
            font-family: 'Ubuntu', sans-serif;
            font-weight: 700;
            font-size: 24px;
            user-select: none;
            z-index: 25;
        }

        /* Inputs & Play Button */
        input {
            padding: 6px 0px;
            font-size: 20px;
            border-radius: 5px;
            border: 4.5px solid var(--input-border-color);
            outline: none;
            font-family: 'Ubuntu', sans-serif;
            background: var(--input-bg-color);
            color: var(--input-text-color);
        }

        input::placeholder {
            color: var(--input-text-color);
        }

        .play-button {
            padding: 4px 20px;
            font-size: 22px;
            color: #ffffff;
            background-color: var(--button-bg-color);
            border: 6px solid var(--button-border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0s, background-color 0s;
            font-family: 'Ubuntu', sans-serif;
        }

        .play-button:hover {
            transform: scale(1);
            background-color: var(--button-hover-color);
        }

        /* === TRANSITION OVERLAY === */
        .transition-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background-color: black;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 100; 
            pointer-events: none;
        }

        .transition-overlay.closing {
            width: 250vmax;
            height: 250vmax;
            transition: width 0.5s ease-in-out, height 0.5s ease-in-out;
        }

        .transition-overlay.opening {
            width: 0;
            height: 0;
            transition: width 0.5s ease-in-out, height 0.5s ease-in-out;
        }

        /* === SIDEBAR BUTTONS === */
        .sidebar-btn {
            position: fixed;
            left: 10px;
            padding: 0px 8px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 20;
            font-family: 'Ubuntu', sans-serif;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: none; 
        }
        
        .sidebar-btn:hover {
            transform: scale(1);
            opacity: 1;
        }

        .sidebar-btn svg {
            display: block;
        }

        .settings-button {
            top: 10px;
            width: 37px;
            height: 37px;
            background-color: var(--settings-bg);
            border: 3px solid var(--settings-border);
            border-radius: 4px;
            padding: 5px;
            z-index: 101; 
        }

        /* --- ACCOUNT BUTTON --- */
        .account-button {
            top: 10px;
            left: 55px; 
            width: 37px;
            height: 37px;
            background-color: var(--account-bg);
            border: 3px solid var(--account-border);
            border-radius: 4px;
            padding: 5px;
            z-index: 101; 
        }

        /* --- CHANGELOG BUTTON --- */
        .changelog-button {
            top: 10px;
            left: 100px;
            width: 37px;
            height: 37px;
            background-color: var(--changelog-bg);
            border: 3px solid var(--changelog-border);
            border-radius: 4px;
            padding: 5px;
            z-index: 101;
        }

        /* --- MENU / RETURN BUTTON --- */
        .menu-return-button {
            top: 10px;
            left: 145px;
            width: 37px;
            height: 37px;
            background-color: #e74c3c; /* Red */
            border: 3px solid #c0392b;
            border-radius: 4px;
            padding: 5px;
            z-index: 101;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: none; /* Hidden on menu, shown in game */
        }
        
        .menu-return-button:hover {
            background-color: #ff5e4d;
        }

        .inventory-button {
            bottom: 140px;
            background-color: #4f91baff;
            border: 4px solid #417697ff;
        }

        .middle-button {
            bottom: 75px;
            background-color: #c45959ff;
            border: 4px solid #954545ff;
        }

        .craft-button {
            bottom: 10px;
            padding: 0px 8px;
            font-size: 6px;
            background-color: var(--craft-bg-color);
            color: var(--craft-text-color);
            border: 4px solid var(--craft-border-color);
            z-index: 20;
        }

        /* === MINIMAP === */
        .minimap-container {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 25;
            display: none; 
            flex-direction: column;
            align-items: center;
        }

        .minimap-content {
            width: 150px;
            height: 150px;
            background-color: var(--minimap-bg);
            border: 4px solid var(--minimap-border);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .minimap-symbol {
            font-size: 20px;
            color: white;
            font-weight: bold;
            user-select: none;
            opacity: 0.5;
        }

        .minimap-label {
            color: var(--minimap-label-color);
            font-weight: bold;
            font-size: 18px;
            margin-top: 5px;
            text-shadow: 2px 2px 0 #000000;
            font-family: 'Ubuntu', sans-serif;
        }

        /* === BACKGROUND STYLES === */
        .svg-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: repeat;
            background-size: 512px 512px; 
            z-index: 1;
            transition: background 0.3s ease;
        }

        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--title-stroke-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--title-stroke-color) 1px, transparent 1px);
            background-size: 32px 32px;
            background-position: center;
            opacity: 0.2; 
            z-index: 1;
            display: none; 
        }

        /* === DROPDOWN MENUS (General) === */
        .dropdown-menu {
            position: fixed;
            top: 60px; 
            width: 250px;
            border-radius: 5px;
            display: none; 
            flex-direction: column; 
            z-index: 100;
            font-family: 'Ubuntu', sans-serif;
        }

        .dropdown-menu.open {
            display: flex;
        }

        /* === SETTINGS DROPDOWN MENU === */
        .settings-menu {
            left: 10px;
            background-color: var(--settings-bg);
            border: 4px solid var(--settings-border);
            padding: 10px;
            color: white;
        }

        .settings-title {
            font-weight: bold;
            font-size: 18px;
            text-align: left;
            margin-bottom: 10px;
            margin-top: 0;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            padding-bottom: 5px;
            text-shadow: 1px 1px 0 #000;
        }

        .setting-item {
            background-color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 4px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            user-select: none;
            margin-bottom: 5px; 
        }
        
        .setting-item:last-child {
            margin-bottom: 0;
        }

        .setting-item:hover {
            background-color: rgba(255, 255, 255, 0.5);
        }

        .setting-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* === ACCOUNT DROPDOWN MENU === */
        .account-menu {
            left: 55px;
            background-color: var(--account-bg);
            border: 4px solid var(--account-border);
            padding: 10px;
            width: 230px;
            box-sizing: border-box;
        }

        .account-title {
            color: white;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 1px 1px 0 #000;
        }

        .account-input {
            width: 100%; 
            margin: 0 auto 8px auto;
            border: 2px solid #000;
            box-sizing: border-box; 
            font-size: 14px;
            padding: 4px 8px;
            display: block;
        }

        .account-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        .auth-btn {
            background-color: #8e44ad; 
            color: white;
            border: 2px solid #6c3483;
            padding: 6px;
            border-radius: 4px;
            font-family: 'Ubuntu', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            box-sizing: border-box; 
        }

        .auth-btn:hover {
            background-color: #7d3c98;
        }

        .logged-in-text {
            color: white;
            font-size: 14px;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .logout-btn {
            background-color: #c0392b; 
            border-color: #962d22;
        }
        
        .logout-btn:hover {
            background-color: #a93226;
        }

        /* === INVENTORY DROPDOWN MENU === */
        .inventory-menu {
            left: 75px;
            bottom: 10px;
            top: auto;
            width: 230px;
            background-color: #4f91baff;
            border: 4px solid #417697ff;
            padding: 10px;
            color: white;
            min-height: 330px; 
        }

        .inventory-title {
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            margin-bottom: 10px;
            margin-top: 0;
            text-shadow: 1px 1px 0 #000;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            padding-bottom: 5px;
        }

        .item-display-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        .icon-stack {
            position: relative;
            width: 50px;
            height: 50px;
        }

        .item-name {
            margin-top: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            font-family: 'Ubuntu', sans-serif;
            text-shadow: 1px 1px 0 #000;
        }

        /* === CHANGELOG DROPDOWN MENU === */
        .changelog-menu {
            left: 100px;
            background-color: var(--changelog-bg);
            border: 4px solid var(--changelog-border);
            max-height: 350px;
            overflow-y: auto;
            padding: 0;
            color: white;
        }

        .changelog-header {
            background-color: rgba(0,0,0,0.1);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }

        .changelog-title {
            font-weight: bold;
            font-size: 18px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            margin: 0;
        }

        .close-changelog {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
            line-height: 1;
        }

        .changelog-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .changelog-entry {
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }

        .changelog-entry:last-child {
            border-bottom: none;
        }

        .changelog-date {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            display: block;
            color: #E8F5E9;
        }

        .changelog-item-text {
            font-size: 13px;
            margin: 2px 0;
            padding-left: 15px;
            position: relative;
        }

        .changelog-item-text::before {
            content: "-";
            position: absolute;
            left: 0;
            color: rgba(255,255,255,0.7);
        }

        .changelog-footer {
            font-size: 11px;
            text-align: center;
            font-style: italic;
            opacity: 0.8;
            padding: 10px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .changelog-menu::-webkit-scrollbar {
            width: 8px;
        }
        .changelog-menu::-webkit-scrollbar-thumb {
            background-color: rgba(255,255,255,0.3);
            border-radius: 4px;
        }

        /* === GAME LAYER & PLAYER === */
        #game-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: none; 
            overflow: hidden;
        }

        #player {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 45px;  
            height: 45px; 
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* === HOTBAR === */
        .hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 10px; 
            z-index: 20;
        }

        .slot-row {
            display: flex;
            gap: 8px; 
        }

        .slot {
            width: 45px; 
            height: 45px;
            background-color: #ffffff;
            border: 3px solid #cccccc; 
            border-radius: 10px;
            box-sizing: border-box;
        }

        .slot-small {
            width: 40px;
            height: 40px;
            background-color: #ffffff;
            border: 2px solid #cccccc;
            border-radius: 10px;
            box-sizing: border-box;
        }

        /* === CHAT BOX === */
        .chat-box {
            position: absolute; 
            left: 70px;
            bottom: 10px; 
            width: 180px; 
            height: 180px; 
            border-radius: 5px;
            display: flex; 
            flex-direction: column;
            padding: 5px;
            font-family: 'Ubuntu', sans-serif;
            user-select: text;
            font-size: 12px; 
            z-index: 30; 
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid #555;
            border-radius: 4px;
            margin-bottom: 5px;
            padding: 5px;
            color: white;
            font-size: 12px; 
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px; 
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background-color: #888;
            border-radius: 2px;
        }

        .chat-input-row {
            display: flex;
            gap: 5px;
        }

        .chat-input {
            width: 100%;
            padding: 4px; 
            border: 2px solid #000000ff;
            border-radius: 4px;
            background-color: white;
            color: black;
            font-family: 'Ubuntu', sans-serif;
            outline: none;
            font-size: 12px;
        }

    </style>
</head>

<body>
    
    <!-- TRANSITION OVERLAY -->
    <div class="transition-overlay" id="transition-overlay"></div>

    <!-- BACKGROUNDS -->
    <div class="svg-background" id="svg-bg"></div>
    <div class="grid-background" id="grid-bg"></div>
    
    <!-- GAME LAYER -->
    <div id="game-layer">
        <!-- Player SVG -->
        <div id="player">
   <img src="assets/skins/flower.svg" width="74" height="74" alt="player">
        </div>

        <!-- CHAT BOX (Inside Game Layer) -->
        <div class="chat-box" id="chat-box">
            <div class="chat-messages" id="chat-messages">
                <div style="font-style:italic; opacity: 0.6;">Welcome to chat!</div>
            </div>
            <div class="chat-input-row">
                <input type="text" class="chat-input" id="chat-input" placeholder="Press Enter">
            </div>
        </div>

        <!-- Hotbar -->
        <div class="hotbar" id="hotbar">
            <div class="slot-row" id="top-row">
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
            </div>
            <div class="slot-row" id="bottom-row">
                <div class="slot-small"></div>
                <div class="slot-small"></div>
                <div class="slot-small"></div>
                <div class="slot-small"></div>
                <div class="slot-small"></div>
            </div>
        </div>
    </div>

    <!-- MENU LAYER -->
    <div class="menu-layer" id="menu-layer">
        <div class="guest-label stylized-text" id="top-right-label">Guest #<span id="random-number"></span></div>

        <div class="menu-container">
            <h1 class="stylized-text">caxtus.io</h1>
            
            <!-- MAP SELECTOR -->
            <div class="map-selector stylized-text">
                <button class="arrow-btn" id="map-left">&lt;</button>
                <span class="map-name" id="map-name">Desert</span>
                <button class="arrow-btn" id="map-right">&gt;</button>
            </div>

            <div class="name-row"> 
                <input type="text" placeholder=""> 
                <button class="play-button" id="start-btn">Play</button> 
            </div>
        </div>
    </div>

    <!-- MINIMAP (Only shows in game) -->
    <div class="minimap-container" id="minimap">
        <div class="minimap-content" id="minimap-content">
            <span class="minimap-symbol">?</span>
        </div>
        <div class="minimap-label">Maze</div>
    </div>

    <!-- SIDEBAR BUTTONS -->
    
    <!-- INVENTORY BUTTON -->
    <button class="sidebar-btn inventory-button" id="inventory-trigger" aria-label="Inventory"> 
        <svg viewBox="0 0 24 24" width="33" height="47" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
            <g id="SVGRepo_bgCarrier" stroke-width="0"/>
            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>
            <g id="SVGRepo_iconCarrier"> 
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12.4856 1.12584C12.1836 0.958052 11.8164 0.958052 11.5144 1.12584L2.51436 6.12584L2.5073 6.13784L2.49287 6.13802C2.18749 6.3177 2 6.64568 2 7V16.9999C2 17.3631 2.19689 17.6977 2.51436 17.874L11.5022 22.8673C11.8059 23.0416 12.1791 23.0445 12.4856 22.8742L21.4856 17.8742C21.8031 17.6978 22 17.3632 22 17V7C22 6.64568 21.8125 6.31781 21.5071 6.13813C21.4996 6.13372 21.4921 6.12942 21.4845 6.12522L12.4856 1.12584ZM5.05923 6.99995L12.0001 10.856L14.4855 9.47519L7.74296 5.50898L5.05923 6.99995ZM16.5142 8.34816L18.9409 7L12 3.14396L9.77162 4.38195L16.5142 8.34816ZM4 16.4115V8.69951L11 12.5884V20.3004L4 16.4115ZM13 20.3005V12.5884L20 8.69951V16.4116L13 20.3005Z" fill="#ffffff"/> 
            </g>
        </svg> 
    </button> 

    <button class="sidebar-btn middle-button" aria-label="Middle">
        <svg width="33" height="47" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="#000000">
            <g id="SVGRepo_bgCarrier stroke-width="0" />

        ];
        let currentMapIndex = 1; // Start at Garden

        // === BACKGROUND LOGIC ===
        function loadMapFromSVG(svgString) {
            const img = new Image();
            const blob = new Blob([svgString], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);

            img.onload = function() {
                const canvas = document.createElement('canvas');
                const size = 512; 
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, size, size);
                const lowResUrl = canvas.toDataURL('image/png');

                const svgBg = document.getElementById('svg-bg');
                
                svgBg.style.backgroundImage = `url(${lowResUrl})`;
                
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }

        // === 2. GAME STATE & ACCOUNTS ===
        const DEV_ACCOUNT = {
            username: "admin",
            password: "admin",
            slots: 10
        };

        const STORAGE_KEY = "caxtus_users";

        function initAccounts() {
            let users = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            if (!users[DEV_ACCOUNT.username]) {
                users[DEV_ACCOUNT.username] = {
                    password: DEV_ACCOUNT.password,
                    slots: DEV_ACCOUNT.slots 
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
            }
        }
        initAccounts();

        const originalGuestNum = Math.floor(Math.random() * 100000);
        const randomNumSpan = document.getElementById('random-number');
        const topRightLabel = document.getElementById('top-right-label');
        randomNumSpan.textContent = originalGuestNum;
        let currentUserData = null; 

        // === 3. CHANGELOG DATA ===
        const changelogData = [
            {
                date: "2026 March 9",
                items: [
                    "added the switch biome",
                    "Added Minimap"
                ]
            },
            {
                date: "2026 Feb 24",
                items: [
                    "changed bg to desert for testing",
                    "soon gonna add grid cuz why not",
                    "Added changelog"
                ]
            },
            {
                date: "2026 Feb 23",
                items: [
                    "trying to make the game playable ofc"
                ]
            }
        ];

        function renderChangelog() {
            const container = document.getElementById('changelog-content');
            container.innerHTML = '';
            
            changelogData.forEach(entry => {
                const div = document.createElement('div');
                div.className = 'changelog-entry';
                
                let html = `<span class="changelog-date">${entry.date}</span>`;
                entry.items.forEach(text => {
                    html += `<div class="changelog-item-text">${text}</div>`;
                });
                
                div.innerHTML = html;
                container.appendChild(div);
            });

            const footer = document.createElement('div');
            footer.className = 'changelog-footer';
            footer.textContent = 'Game made by Delerial and Crazylight';
            container.appendChild(footer);
        }
        renderChangelog();

        // === 4. UI INTERACTION LOGIC ===
        const settingsTrigger = document.getElementById('settings-trigger');
        const settingsMenu = document.getElementById('settings-menu');
        const accountTrigger = document.getElementById('account-trigger');
        const accountMenu = document.getElementById('account-menu');
        const changelogTrigger = document.getElementById('changelog-trigger');
        const changelogMenu = document.getElementById('changelog-menu');
        const closeChangelog = document.getElementById('close-changelog');
        
        // New Inventory elements
        const inventoryTrigger = document.getElementById('inventory-trigger');
        const inventoryMenu = document.getElementById('inventory-menu');

        function closeAllDropdowns() {
            settingsMenu.classList.remove('open');
            accountMenu.classList.remove('open');
            changelogMenu.classList.remove('open');
            inventoryMenu.classList.remove('open');
        }

        settingsTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = settingsMenu.classList.contains('open');
            closeAllDropdowns();
            if (!isOpen) settingsMenu.classList.add('open');
        });

        accountTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = accountMenu.classList.contains('open');
            closeAllDropdowns();
            if (!isOpen) accountMenu.classList.add('open');
        });

        changelogTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = changelogMenu.classList.contains('open');
            closeAllDropdowns();
            if (!isOpen) changelogMenu.classList.add('open');
        });

        closeChangelog.addEventListener('click', (e) => {
            e.stopPropagation();
            changelogMenu.classList.remove('open');
        });

        // Inventory Logic
        inventoryTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = inventoryMenu.classList.contains('open');
            closeAllDropdowns();
            if (!isOpen) inventoryMenu.classList.add('open');
        });

        // Click outside to close logic
        document.addEventListener('click', (e) => {
            if (!settingsMenu.contains(e.target) && !settingsTrigger.contains(e.target)) {
                settingsMenu.classList.remove('open');
            }
            if (!accountMenu.contains(e.target) && !accountTrigger.contains(e.target)) {
                accountMenu.classList.remove('open');
            }
            if (!changelogMenu.contains(e.target) && !changelogTrigger.contains(e.target)) {
                changelogMenu.classList.remove('open');
            }
            if (!inventoryMenu.contains(e.target) && !inventoryTrigger.contains(e.target)) {
                inventoryMenu.classList.remove('open');
            }
        });

        const optKeyboard = document.getElementById('opt-keyboard');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const displayUsername = document.getElementById('display-username');
        const formView = document.getElementById('account-form-view');
        const loggedInView = document.getElementById('account-logged-in-view');
        const topRow = document.getElementById('top-row');
        const bottomRow = document.getElementById('bottom-row');

        function updateHotbar(slotsCount) {
            topRow.innerHTML = '';
            bottomRow.innerHTML = '';
            let topSlots = Math.min(slotsCount, 5);
            let bottomSlots = Math.max(0, slotsCount - 5);

            for (let i = 0; i < topSlots; i++) {
                const div = document.createElement('div');
                div.className = 'slot';
                topRow.appendChild(div);
            }
            for (let i = 0; i < bottomSlots; i++) {
                const div = document.createElement('div');
                div.className = 'slot-small';
                bottomRow.appendChild(div);
            }
        }

        document.querySelector('.create-btn').addEventListener('click', () => {
            const u = usernameInput.value.trim();
            const p = passwordInput.value.trim();
            if (!u || !p) return;

            const users = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (users[u]) {
                alert("Username already taken!");
                return;
            }

            users[u] = { password: p, slots: 5 };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
            loginUser(u, users[u]);
        });

        document.querySelector('.login-btn').addEventListener('click', () => {
            const u = usernameInput.value.trim();
            const p = passwordInput.value.trim();
            if (!u || !p) return;

            const users = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (users[u] && users[u].password === p) {
                loginUser(u, users[u]);
            } else {
                alert("Invalid username or password.");
            }
        });

        function loginUser(username, userData) {
            currentUserData = { username, ...userData };
            displayUsername.textContent = username;
            topRightLabel.textContent = username;
            updateHotbar(userData.slots);

            formView.style.display = 'none';
            loggedInView.style.display = 'block';
            closeAllDropdowns();
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            currentUserData = null;
            usernameInput.value = '';
            passwordInput.value = '';
            topRightLabel.textContent = "Guest #" + originalGuestNum;
            updateHotbar(5);
            loggedInView.style.display = 'none';
            formView.style.display = 'block';
            closeAllDropdowns();
        });

        // === MAP SWITCHING LOGIC ===
        const mapNameDisplay = document.getElementById('map-name');
        const mapLeftBtn = document.getElementById('map-left');
        const mapRightBtn = document.getElementById('map-right');

        function updateMapUI() {
            const map = MAPS[currentMapIndex];
            mapNameDisplay.textContent = map.name;
            loadMapFromSVG(map.svg);
        }

        mapLeftBtn.addEventListener('click', () => {
            currentMapIndex--;
            if (currentMapIndex < 0) currentMapIndex = MAPS.length - 1;
            updateMapUI();
        });

        mapRightBtn.addEventListener('click', () => {
            currentMapIndex++;
            if (currentMapIndex >= MAPS.length) currentMapIndex = 0;
            updateMapUI();
        });

        // Initialize Map
        updateMapUI();

        // === 5. CHAT LOGIC ===
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        function addMessage(msg) {
            const div = document.createElement('div');
            div.textContent = msg;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;
            const displayName = currentUserData ? currentUserData.username : "Guest";
            addMessage(`${displayName}: ${text}`);
            chatInput.value = '';
            chatInput.blur();
        }

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });


        // === 6. GAME LOOP & LOGIC ===
        const startBtn = document.getElementById('start-btn');
        const menuLayer = document.getElementById('menu-layer');
        const gameLayer = document.getElementById('game-layer');
        const transitionOverlay = document.getElementById('transition-overlay');
        const svgBg = document.getElementById('svg-bg');
        const gridBg = document.getElementById('grid-bg');
        const minimapContainer = document.getElementById('minimap');
        const menuReturnBtn = document.getElementById('menu-return-btn');
        
        const eyeRight = document.getElementById('eye-right');
        const eyeLeft = document.getElementById('eye-left');

        let isPlaying = false;
        let bgX = 0;
        let bgY = 0;
        let velX = 0;
        let velY = 0;
        const acceleration = 0.8; 
        const friction = 0.9;     
        const maxSpeed = 10;      
        const keys = {};
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        const maxEyeMove = 3; 
        
        let currentEyeX = 0;
        let currentEyeY = 0;

        // Function to return to menu
        function returnToMenu() {
            if(!isPlaying) return;
            
            // 1. Play transition
            transitionOverlay.classList.add('closing');
            transitionOverlay.classList.remove('opening');

            // 2. Wait for transition, then hide game and show menu
            setTimeout(() => {
                isPlaying = false;
                gameLayer.style.display = 'none';
                minimapContainer.style.display = 'none';
                menuReturnBtn.style.display = 'none';
                menuLayer.classList.remove('hidden');
                
                // Reset position
                bgX = 0;
                bgY = 0;
                velX = 0;
                velY = 0;
                svgBg.style.backgroundPosition = `0px 0px`;
                gridBg.style.backgroundPosition = `0px 0px`;

                // Fade out transition
                transitionOverlay.classList.remove('closing');
                transitionOverlay.classList.add('opening');
            }, 500);
        }

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        startBtn.addEventListener('click', () => {
            transitionOverlay.classList.add('closing');
            transitionOverlay.classList.remove('opening');

            setTimeout(() => {
                menuLayer.classList.add('hidden'); 
                gameLayer.style.display = 'block';   
                minimapContainer.style.display = 'flex'; // Show Minimap
                menuReturnBtn.style.display = 'block'; // Show Return Button
                isPlaying = true;
                requestAnimationFrame(gameLoop);
                transitionOverlay.classList.remove('closing');
                transitionOverlay.classList.add('opening');
            }, 500);
        });

        // Bind the new return button
        menuReturnBtn.addEventListener('click', returnToMenu);

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function gameLoop() {
            if (!isPlaying) return;

            const useKeyboard = optKeyboard.checked;
            
            if (useKeyboard) {
                if (keys.d || keys.D || keys.ArrowRight) velX -= acceleration;
                if (keys.a || keys.A || keys.ArrowLeft)  velX += acceleration;
                if (keys.s || keys.S || keys.ArrowDown)  velY -= acceleration;
                if (keys.w || keys.W || keys.ArrowUp)    velY += acceleration;
            } else {
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const dx = mouseX - centerX;
                const dy = mouseY - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 10) {
                    const moveX = -(dx / distance) * acceleration;
                    const moveY = -(dy / distance) * acceleration;
                    velX += moveX;
                    velY += moveY;
                }
            }

            velX *= friction;
            velY *= friction;

            if (Math.abs(velX) < 0.1) velX = 0;
            if (Math.abs(velY) < 0.1) velY = 0;

            bgX += velX;
            bgY += velY;

            // Update Main Background
            svgBg.style.backgroundPosition = `${bgX}px ${bgY}px`;
            gridBg.style.backgroundPosition = `${bgX}px ${bgY}px`;

            if (!useKeyboard) {
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const dx = mouseX - centerX;
                const dy = mouseY - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > 0) {
                    currentEyeX = (dx / distance) * maxEyeMove;
                    currentEyeY = (dy / distance) * maxEyeMove;
                }
            } else {
                const speed = Math.sqrt(velX * velX + velY * velY);
                
                if (speed > 0.5) {
                    const dirX = velX / speed;
                    const dirY = velY / speed;
                    
                    currentEyeX = -dirX * maxEyeMove;
                    currentEyeY = -dirY * maxEyeMove;
                }
            }

            if (eyeLeft) eyeLeft.setAttribute('transform', `translate(${currentEyeX}, ${currentEyeY})`);
            if (eyeRight) eyeRight.setAttribute('transform', `translate(${currentEyeX}, ${currentEyeY})`);

            requestAnimationFrame(gameLoop);
        }

    </script>
